[project]
name = "kalshi-polymarket-arb"
version = "0.1.0"
description = "Cross-platform prediction market arbitrage scanner and bot"
requires-python = ">=3.10"
dependencies = [
    "pmxt>=2.30.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "rapidfuzz>=3.0",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "httpx>=0.24",
    "aiosqlite>=0.19",
    "pyarrow>=14.0",
    "structlog>=23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]
ml = [
    "scikit-learn>=1.3",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
